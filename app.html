<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials Control - App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    body {
      min-height: 100vh;
      background-color: var(--color-bg-main);
      padding: var(--space-2xl);
    }

    .app-card {
      max-width: 600px;
      margin: 0 auto;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card app-card">
    <div class="flex items-center justify-between mb-lg">
      <h2 class="text-title">Materials Control</h2>
      <button type="button" id="btn-logout" class="btn btn-secondary btn-sm">
        <span class="material-symbols-outlined">logout</span>
        Sair
      </button>
    </div>

    <div class="alert alert-info mb-lg">
      <div>
        <p class="text-body font-semibold" id="user-name">Carregando...</p>
        <p class="text-body-sm" id="user-role">Perfil: ...</p>
      </div>
    </div>

    <p class="text-body text-muted">
      Ambiente principal do sistema. O layout completo com shell e rotas será implementado na T-003.
    </p>
  </div>

  <script type="module">
    import { requireAuth } from './js/guards.js';
    import { logout } from './js/auth.js';
    import { esc } from './js/ui.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const profile = await requireAuth();
      if (!profile) return;

      document.getElementById('user-name').textContent = profile.full_name || 'Usuário Sem Nome';
      document.getElementById('user-role').textContent = `Perfil: ${profile.role || 'solicitante'}`;

      document.getElementById('btn-logout').addEventListener('click', () => {
        logout();
      });
    });
  </script>
</body>
</html>
