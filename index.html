<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials Control - Autenticação</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--color-bg-main);
      padding: var(--space-lg);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--color-brand-dark);
      margin-bottom: var(--space-xs);
    }

    .auth-brand .material-symbols-outlined {
      font-size: 2rem;
      color: var(--color-brand-primary);
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border-subtle);
      margin-bottom: var(--space-xl);
    }

    .auth-tab {
      flex: 1;
      padding: var(--space-md);
      text-align: center;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: var(--font-family);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .auth-tab:hover {
      color: var(--color-brand-dark);
    }

    .auth-tab.active {
      color: var(--color-brand-primary);
      border-bottom-color: var(--color-brand-primary);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <span class="material-symbols-outlined">inventory_2</span>
        <h1 class="text-title">Materials Control</h1>
      </div>
      <p class="text-body-sm">Sistema de Requisição e Controle de Insumos</p>
    </div>

    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">
        Entrar
      </button>
      <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="form-signup">
        Criar conta
      </button>
    </div>

    <div id="auth-alert" class="alert hidden" role="alert">
      <span class="alert-message"></span>
    </div>

    <!-- Login Form -->
    <form id="form-login" class="auth-form active" role="tabpanel" aria-labelledby="tab-login" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">E-mail</label>
        <input type="email" id="login-email" class="form-input" placeholder="seu.email@empresa.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Senha</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-login-submit" class="btn btn-primary w-full mt-md">
        Entrar
      </button>
    </form>

    <!-- SignUp Form -->
    <form id="form-signup" class="auth-form" role="tabpanel" aria-labelledby="tab-signup" novalidate>
      <div class="form-group">
        <label for="signup-fullname" class="form-label">Nome Completo</label>
        <input type="text" id="signup-fullname" class="form-input" placeholder="Seu Nome Completo" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="signup-email" class="form-label">E-mail</label>
        <input type="email" id="signup-email" class="form-input" placeholder="seu.email@empresa.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="signup-password" class="form-label">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="signup-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="signup-confirm-password" class="form-label">Confirmar Senha</label>
        <input type="password" id="signup-confirm-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" id="btn-signup-submit" class="btn btn-primary w-full mt-md">
        Criar Conta
      </button>
    </form>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
