<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials Control v1.0 — Login</title>

  <!-- Estilos base e de componentes -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="login-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-lg);">
    <div class="card" style="width: 100%; max-width: 400px;">
      <div class="card-header" style="text-align: center;">
        <h1 class="card-title" style="font-size: 1.5rem; color: var(--color-brand-black);">Materials Control</h1>
        <p style="font-size: 0.875rem; color: var(--color-text-muted); margin-top: var(--space-xs);">Insumos Control v1.0</p>
      </div>

      <div id="login-alert" class="alert alert-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">E-mail corporativo</label>
          <input type="email" id="email" class="form-input" placeholder="seu.nome@empresa.com" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Senha</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-md);">Entrar</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { login, getCurrentSession } from './js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // Verificar se o usuário já possui sessão ativa
      const session = await getCurrentSession();
      if (session) {
        window.location.href = 'app.html';
        return;
      }

      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        alertBox.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          await login(email, password);
          window.location.href = 'app.html';
        } catch (err) {
          alertBox.textContent = err.message;
          alertBox.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
        }
      });
    });
  </script>
</body>
</html>
